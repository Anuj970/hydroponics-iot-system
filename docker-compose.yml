version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src

  firmware:
    build:
      context: ./firmware
      dockerfile: Dockerfile
    volumes:
      - ./firmware/src:/app/src

networks:
  default:
    driver: bridge